# CodeRabbit config.
# Сужаем авто-ревью до КОДА: исключаем документацию, скиллы, генерируемые и
# бинарные файлы. Крупные релизные PR (dev -> main) тащат сотни удалений
# легаси-доков/скиллов и упираются в лимит 150 файлов — из-за чего ревью
# пропускается целиком. С фильтрами «в обработку» попадает только код.
reviews:
  path_filters:
    - "!**/*.md"
    - "!.ai-factory/**"
    - "!.agents/**"
    - "!.claude/**"
    - "!docs/**"
    - "!**/migrations/meta/**"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/*.png"
    - "!**/*.webp"
    - "!**/*.svg"
