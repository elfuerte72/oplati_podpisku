name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Репозиторий ПУБЛИЧНЫЙ, а `.gitignore` ловит только известные имена файлов
  # (`.env*`). Секрет, вписанный прямо в код, конфиг или тестовую фикстуру, он не
  # увидит — а в проекте уже был случай засвеченного токена бота. Сканер смотрит
  # содержимое, а не имена.
  #
  # ГЛУБИНА СКАНА ЗАВИСИТ ОТ СОБЫТИЯ (снято прогоном 2026-07-25, в доке action'а
  # это не выделено):
  #   pull_request      — только коммиты самого PR (у нашего первого прогона это
  #                       был 1 коммит, 5.86 КБ), `fetch-depth: 0` на это не влияет;
  #   workflow_dispatch — ВСЯ история (195 коммитов, 7.26 МБ);
  #   schedule          — то же, еженедельно по понедельникам.
  # То есть PR-чек ловит новую утечку, а исторические находит только полный
  # прогон. Оба нужны, и по этой же причине `fetch-depth: 0` оставлен.
  #
  # Полный прогон 2026-07-25: 1 находка, разобрана вручную — плейсхолдер
  # `sk_live_abc123` из обучающего чек-листа (раздел «Never Do This»), внесён в
  # `.gitleaksignore` с обоснованием. Реальных утечек в истории нет, поэтому чек
  # блокирующий, без `continue-on-error`.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Нужна полная история — иначе прогон по расписанию не увидит секрет,
          # удалённый следующим коммитом: в объектах он остаётся, а репозиторий
          # публичный.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail only on HIGH/CRITICAL; adjust when dedicated SLA is defined.
      # 2026-07-15: npm отключил старый audit-эндпоинт (410 Gone), а pnpm (включая
      # latest) ещё не переехал на bulk advisory API — шаг падал на каждом PR по
      # внешней причине и блокировал merge (required check). continue-on-error до
      # фикса в pnpm; реальный PR-гейт по уязвимостям — job dependency-review ниже
      # (GitHub Advisory DB, fail-on-severity high).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Намерение — гейтить только production (runtime) зависимости,
          # консистентно с job'ом dependency-audit выше (`pnpm audit --prod`).
          # ВАЖНО: GitHub dependency-graph для pnpm-lock.yaml не различает
          # dev/prod надёжно и помечает почти всё как `runtime`, поэтому одного
          # fail-on-scopes мало.
          fail-on-scopes: runtime
          # Точечное исключение: GHSA-5xrq-8626-4rwp — vitest <4.1.0, critical,
          # но это DEV-инструмент (нет в прод-бандле; стреляет только при
          # запущенном Vitest UI server). Для задеплоенного бота риск нулевой.
          # Убрать это исключение после апгрейда vitest до >=4.1.0 (follow-up).
          allow-ghsas: GHSA-5xrq-8626-4rwp
          comment-summary-in-pr: on-failure
